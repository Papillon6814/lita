<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Lita — 起動画面（案 B: 二段階が小さく進む）</title>
<link rel="stylesheet" href="_launch.css">
</head><body>

<p class="caption"><b>案 B: 二段階が小さく進む</b> — ①サインインを確かめている。点が二つ並び、いまの段階だけがミント</p>
<div class="frame"><div class="win"><div class="stage">
  <p class="mark">Lita<span class="dot">.</span></p>
  <p class="tag">あなたの文体で、あなたの投稿を。</p>
  <div class="steps">
    <div class="step now"><span class="bead now"></span><span class="lb">サインイン</span></div>
    <span class="bar"></span>
    <div class="step"><span class="bead"></span><span class="lb">Codex</span></div>
  </div>
</div></div></div>

<p class="caption"><b>案 B</b> — ②サインインが済み、Codex を確かめている。点が一つ進む</p>
<div class="frame"><div class="win"><div class="stage">
  <p class="mark">Lita<span class="dot">.</span></p>
  <p class="tag">あなたの文体で、あなたの投稿を。</p>
  <div class="steps">
    <div class="step"><span class="bead done"></span><span class="lb">サインイン</span></div>
    <span class="bar done"></span>
    <div class="step now"><span class="bead now"></span><span class="lb">Codex</span></div>
  </div>
</div></div></div>

<p class="caption"><b>案 B</b> — ③3 秒を超えたとき</p>
<div class="frame"><div class="win"><div class="stage">
  <p class="mark">Lita<span class="dot">.</span></p>
  <p class="tag">あなたの文体で、あなたの投稿を。</p>
  <div class="steps">
    <div class="step"><span class="bead done"></span><span class="lb">サインイン</span></div>
    <span class="bar done"></span>
    <div class="step now"><span class="bead now"></span><span class="lb">Codex</span></div>
  </div>
  <p class="slow">時間がかかっています。もう少しお待ちください。</p>
</div></div></div>

</body></html>
