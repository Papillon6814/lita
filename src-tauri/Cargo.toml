[package]
name = "lita"
version = "0.1.0"
description = "Lita writes your posts, in your voice, using the Codex login you already have."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "lita_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lita-auth = { path = "../crates/lita-auth" }
lita-codex = { path = "../crates/lita-codex" }
lita-sources = { path = "../crates/lita-sources" }
lita-store = { path = "../crates/lita-store" }
anyhow = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
